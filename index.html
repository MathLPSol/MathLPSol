<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0">
    <title>MathLPSol</title>
    
    <link href="https://fonts.googleapis.com/css2?family=STIX+Two+Text:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500;1,600&family=Source+Sans+3:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&family=Source+Code+Pro:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="layout">

        <aside class="sidebar">
            <div class="sb-inner">
                <div class="logo-area">
                    <div class="logo-eyebrow">LP Solver</div>
                    <div class="logo-title">Tối Ưu Tuyến Tính</div>
                    <div class="logo-sub">Đơn hình · Đối ngẫu · Gomory</div>
                </div>
                
                <div class="slbl">Cấu hình <span></span></div>
                <div class="frow">
                    <div class="field">
                        <label>Số biến (n)</label>
                        <input type="number" id="nv" min="1" max="8" value="2" onchange="buildForm()">
                    </div>
                    <div class="field">
                        <label>Ràng buộc (m)</label>
                        <input type="number" id="nc" min="1" max="12" value="2" onchange="buildForm()">
                    </div>
                </div>
                
                <div class="field" style="margin-bottom:10px">
                    <label>Mục tiêu</label>
                    <select id="ot" class="sel-full">
                        <option value="max">Tối đa hoá — Max Z</option>
                        <option value="min">Tối thiểu hoá — Min Z</option>
                    </select>
                </div>
                
                <div class="slbl">Hàm mục tiêu <span></span></div>
                <div class="obj-strip" id="objdiv">
                    <span class="z-lbl">Z =</span>
                </div>
                
                <div class="slbl">Ràng buộc <span></span></div>
                <div class="con-block" id="condiv"></div>
                
                <div class="nn-note" id="nnlbl">x₁, x₂ ≥ 0</div>
                
                <div class="slbl">Tùy chọn <span></span></div>
                <div class="toggle-list">
                    <label class="tgl" style="opacity:.6;pointer-events:none">
                        <input type="checkbox" id="sfrac" checked disabled>
                        <div>
                            <div class="tgl-main">Hiển thị phân số chính xác</div>
                            <div class="tgl-sub">Kết quả luôn hiển thị dạng p/q</div>
                        </div>
                    </label>
                    <label class="tgl">
                        <input type="checkbox" id="sint">
                        <div>
                            <div class="tgl-main">Nghiệm nguyên (Gomory)</div>
                            <div class="tgl-sub">Chạy thuật toán cắt sau khi có nghiệm LP</div>
                        </div>
                    </label>
                </div>
                
                <div class="action-area">
                    <button class="btn-solve" onclick="solve()">
                        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polygon points="5 3 19 12 5 21 5 3"/></svg>
                        Giải tự động
                    </button>
                    <button class="btn-solve" onclick="solveManual()" style="background:var(--purple);margin-top:-2px">
                        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 013 3L7 19l-4 1 1-4L16.5 3.5z"/></svg>
                        Giải thủ công (tự chọn pivot)
                    </button>
                    <div class="btn-row">
                        <button class="btn-ex" onclick="ex(1)">Ví dụ 1 (Max ≤)</button>
                        <button class="btn-ex" onclick="ex(2)">Ví dụ 2 (Min ≥)</button>
                        <button class="btn-ex" onclick="ex(3)">Gomory</button>
                        <button class="btn-clr" onclick="clrAll()">Xóa</button>
                    </div>
                </div>
            </div>
        </aside>

        <main class="main">
            <div class="placeholder-wrap" id="placeholder">
                <div class="placeholder-icon">∑</div>
                <div class="placeholder-title">Chưa có kết quả</div>
                <div class="placeholder-desc">Nhập dữ liệu bên trái rồi nhấn <strong>Giải bài toán</strong>.</div>
            </div>
            <div id="sol"></div>
        </main>
    </div>

    <div class="statusbar">
        <div class="sdot" id="sdot"></div>
        <span id="stxt">Sẵn sàng</span>
    </div>

    <footer id="site-footer">
        <div class="footer-copy">Mọi quyền được bảo lưu &copy; MathLPSol</div>
        <div class="footer-link">
            <a href="https://mathlpsol.com" target="_blank">TP.MINH TIẾN &ndash; MathLPSol.com</a>
        </div>
    </footer>

    <script src="math_logic.js"></script>
    <script src="ui_logic.js"></script>
</body>
</html>
